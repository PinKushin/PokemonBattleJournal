name: Windows UI Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, main]

jobs:
  ui-tests-windows:
    name: Windows UI Tests (${{ matrix.fixture }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: [AboutPageTests, MainPageTests, OptionsPageTests, ReadJournalPageTests, TrainerPageTests]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: nuget-windows-

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Enable Developer Mode (required for unpackaged MAUI)
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Appium and Windows driver
        run: |
          npm install -g appium
          appium driver install windows || appium driver update windows

      - name: Restore
        run: dotnet restore PokemonBattleJournal.UITests/UITests.Windows/UITests.Windows.csproj

      - name: Run Windows UI Tests
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: dotnet test PokemonBattleJournal.UITests/UITests.Windows/UITests.Windows.csproj --no-restore --filter "FullyQualifiedName~${{ matrix.fixture }}" --logger "trx;LogFileName=windows-ui-tests-${{ matrix.fixture }}.trx"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-ui-test-results-${{ matrix.fixture }}
          path: '**/*.trx'

      - name: Upload timing logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-ui-timing-logs-${{ matrix.fixture }}
          path: |
            ${{ runner.temp }}/UITests.PerfLog.txt
            ${{ runner.temp }}/UITests.NavLog.txt
            ${{ runner.temp }}/UITests.Windows.setup.log

name: Windows UI Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, main]

jobs:
  ui-tests-windows:
    name: Windows UI Tests (${{ matrix.fixture }})
    # One self-hosted runner takes one job at a time, so this five-way matrix runs
    # SEQUENTIALLY here — roughly five times the wall clock of the hosted version,
    # where the five fixtures get five VMs. The Android workflow is on a different
    # runner, so that one does overlap with this.
    runs-on: [self-hosted, Windows, X64]
    env:
      DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
      DOTNET_ROOT: ${{ runner.temp }}/.dotnet
    strategy:
      fail-fast: false
      matrix:
        fixture: [AboutPageTests, MainPageTests, OptionsPageTests, ReadJournalPageTests, TrainerPageTests]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      # Restore-only: the matching save runs in exactly one fixture (see "Save NuGet
      # cache" below). actions/cache would add a post-step to all five matrix jobs.
      - name: Restore NuGet cache
        id: nuget-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: nuget-windows-

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Enable Developer Mode (required for unpackaged MAUI)
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Appium and Windows driver
        run: |
          npm install -g appium
          appium driver install windows || appium driver update windows

      - name: Restore
        run: dotnet restore PokemonBattleJournal.UITests/UITests.Windows/UITests.Windows.csproj

      # Exactly one fixture saves, and only when the primary key actually missed.
      # Previously all five jobs ran actions/cache with the same key: on any key
      # rotation (a .csproj edit, or the 2026-08-05 LF switch, which changed every
      # checked-out file's bytes and so the hashFiles result) all five spent ~173s
      # compressing the NuGet cache and four then died with "Unable to reserve cache
      # with key ..., another job may be creating this cache" — ~11 min of wasted
      # runner time per run, with one job hanging long enough to need cancelling by
      # hand.
      #
      # Only one job has a save step now, so finishing order is irrelevant and there is
      # nothing left to contend over. The fixture is designated arbitrarily — any single
      # one works. always() means a test failure still saves; the only run that skips
      # the save is one where this specific job is cancelled, costing one cold restore
      # next time.
      # Disabled while this runs on a self-hosted runner: ~/.nuget/packages there is
      # the developer's real package cache, which persists between runs anyway. Saving
      # it would upload gigabytes of the local machine's packages to GitHub for no
      # benefit. Re-enable together with runs-on: windows-latest.
      - name: Save NuGet cache
        if: false && always() && matrix.fixture == 'AboutPageTests' && steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ hashFiles('**/*.csproj', '**/*.slnx') }}

      - name: Run Windows UI Tests
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: dotnet test PokemonBattleJournal.UITests/UITests.Windows/UITests.Windows.csproj --no-restore --filter "FullyQualifiedName~${{ matrix.fixture }}" --logger "trx;LogFileName=windows-ui-tests-${{ matrix.fixture }}.trx"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-ui-test-results-${{ matrix.fixture }}
          path: '**/*.trx'

      - name: Upload timing logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-ui-timing-logs-${{ matrix.fixture }}
          path: |
            ${{ runner.temp }}/UITests.PerfLog.txt
            ${{ runner.temp }}/UITests.NavLog.txt
            ${{ runner.temp }}/UITests.Windows.setup.log

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, main]

# Least privilege for GITHUB_TOKEN. Without this the token takes the repository
# default, which on a public repo with pull_request triggers means workflow code
# proposed by a stranger runs with whatever that default happens to be. Read-only
# is all any job here needs: nothing writes to the repo, opens a release, or
# comments on a PR. Flagged as actions/missing-workflow-permissions by CodeQL.
permissions:
  contents: read

jobs:
  # ── Unit tests ────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore PokemonBattleJournal.Tests/PokemonBattleJournal.Tests.csproj

      - name: Test with coverage
        run: dotnet test PokemonBattleJournal.Tests/PokemonBattleJournal.Tests.csproj --no-restore --collect "XPlat Code Coverage" --logger "trx;LogFileName=unit.trx" --results-directory TestResults/unit

      # Proves the green tick above measured the whole suite. A crashed test host prints "Passed!"
      # with a truncated total and still exits 0, so neither the status check nor the summary line
      # can distinguish a full run from a partial one. This compares discovered against executed;
      # the script header carries the rest. Verified by manipulation before it was wired in: a
      # 37-of-704 run exits 1 here.
      - name: Assert every discovered test ran
        run: pwsh -NoProfile -File build/assert-test-inventory.ps1 -Project PokemonBattleJournal.Tests/PokemonBattleJournal.Tests.csproj -TrxPath "TestResults/unit/unit.trx"
        shell: pwsh

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5
        with:
          reports: TestResults/unit/**/coverage.cobertura.xml
          targetdir: TestResults/unit/report
          reporttypes: Html;MarkdownSummaryGithub

      - name: Write coverage summary to job
        run: Get-Content TestResults/unit/report/SummaryGithub.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
        shell: pwsh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage-report
          path: TestResults/unit/report

  # ── Integration tests ─────────────────────────────────────────────────────
  # The app head itself, which nothing else in this workflow compiles. Unit and integration tests
  # build only net10.0 projects, so a break in the Windows head — XAML, WinUI-specific code, a
  # missing workload — stayed invisible here and surfaced only in the Windows UI suite, a job that
  # takes ~15 minutes and reports it as a test failure in OneTimeSetUp rather than as a build error.
  # That is exactly how the 2026-08-11 NETSDK1147 breakage went a week unnoticed. This job answers
  # the same question in about a minute.
  #
  # Release, not Debug: Debug does not fully compile XAML, so XamlC errors and warnings only appear
  # in Release. PbjWindowsHeadOnly trims the app to the Windows TFM so restore does not demand the
  # android workload — see the note in PokemonBattleJournal.csproj.
  windows-head-build:
    name: Windows Head Build
    runs-on: windows-latest
    env:
      PbjWindowsHeadOnly: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Build app (Windows head, Release)
        run: dotnet build PokemonBattleJournal/PokemonBattleJournal.csproj -f net10.0-windows10.0.19041.0 -c Release -warnaserror

  integration-tests:
    name: Integration Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore PokemonBattleJournal.IntegrationTests/PokemonBattleJournal.IntegrationTests.csproj

      - name: Test with coverage
        run: dotnet test PokemonBattleJournal.IntegrationTests/PokemonBattleJournal.IntegrationTests.csproj --no-restore --filter "Category!=LiveWeb" --collect "XPlat Code Coverage" --logger "trx;LogFileName=integration.trx" --results-directory TestResults/integration

      # Same proof as the unit lane. The filter MUST match the one above: discovery honours it
      # (measured — 248 unfiltered, 241 under Category!=LiveWeb), so passing a different filter
      # here would fail for a reason that is not a defect.
      - name: Assert every discovered test ran
        run: pwsh -NoProfile -File build/assert-test-inventory.ps1 -Project PokemonBattleJournal.IntegrationTests/PokemonBattleJournal.IntegrationTests.csproj -Filter "Category!=LiveWeb" -TrxPath "TestResults/integration/integration.trx"
        shell: pwsh

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5
        with:
          reports: TestResults/integration/**/coverage.cobertura.xml
          targetdir: TestResults/integration/report
          reporttypes: Html;MarkdownSummaryGithub

      - name: Write coverage summary to job
        run: Get-Content TestResults/integration/report/SummaryGithub.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
        shell: pwsh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-coverage-report
          path: TestResults/integration/report

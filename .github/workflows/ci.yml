name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, main]

jobs:
  # ── Unit tests ────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        # Step level, not job level. `runner` is not among the contexts allowed in
        # jobs.<id>.env, and using it there is a startup failure: the whole run dies
        # with zero jobs created and no readable log. Verified 2026-08-06 - three
        # workflows, all three dead on arrival.
        # Needed at all because setup-dotnet otherwise writes under Program Files,
        # which a non-admin self-hosted runner cannot do.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
          DOTNET_ROOT: ${{ runner.temp }}/.dotnet
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore PokemonBattleJournal.Tests/PokemonBattleJournal.Tests.csproj

      - name: Test with coverage
        run: dotnet test PokemonBattleJournal.Tests/PokemonBattleJournal.Tests.csproj --no-restore --collect "XPlat Code Coverage" --results-directory TestResults/unit

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: TestResults/unit/**/coverage.cobertura.xml
          targetdir: TestResults/unit/report
          reporttypes: Html;MarkdownSummaryGithub

      - name: Write coverage summary to job
        run: Get-Content TestResults/unit/report/SummaryGithub.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
        shell: pwsh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage-report
          path: TestResults/unit/report

  # ── Integration tests ─────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        # Step level, not job level. `runner` is not among the contexts allowed in
        # jobs.<id>.env, and using it there is a startup failure: the whole run dies
        # with zero jobs created and no readable log. Verified 2026-08-06 - three
        # workflows, all three dead on arrival.
        # Needed at all because setup-dotnet otherwise writes under Program Files,
        # which a non-admin self-hosted runner cannot do.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
          DOTNET_ROOT: ${{ runner.temp }}/.dotnet
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore PokemonBattleJournal.IntegrationTests/PokemonBattleJournal.IntegrationTests.csproj

      - name: Test with coverage
        run: dotnet test PokemonBattleJournal.IntegrationTests/PokemonBattleJournal.IntegrationTests.csproj --no-restore --filter "Category!=LiveWeb" --collect "XPlat Code Coverage" --results-directory TestResults/integration

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: TestResults/integration/**/coverage.cobertura.xml
          targetdir: TestResults/integration/report
          reporttypes: Html;MarkdownSummaryGithub

      - name: Write coverage summary to job
        run: Get-Content TestResults/integration/report/SummaryGithub.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
        shell: pwsh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-coverage-report
          path: TestResults/integration/report

name: CI

on:
  push:
    branches: [master, main, 'feature/**']
  pull_request:
    branches: [master, main]

jobs:
  # ── Unit tests ────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore PokemonBattleJournal.Tests/PokemonBattleJournal.Tests.csproj

      - name: Test
        run: dotnet test PokemonBattleJournal.Tests/PokemonBattleJournal.Tests.csproj --collect "Code Coverage" --no-restore

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: PokemonBattleJournal.Tests/TestResults/**/*.coverage

  # ── Windows UI tests ──────────────────────────────────────────────────────
  windows-ui-tests:
    name: Windows UI Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Enable Developer Mode (required for unpackaged MAUI)
        run: |
          reg add "HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" `
            /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium + Windows driver
        run: |
          npm install -g appium
          appium driver install windows

      - name: Restore UI test project
        run: dotnet restore PokemonBattleJournal.UITests/UITests.Windows/UITests.Windows.csproj

      # AppiumSetup.BuildWindowsApp() builds the MAUI exe (outputs to win-x64/ on net10) before connecting
      - name: Run Windows UI tests
        run: dotnet test PokemonBattleJournal.UITests/UITests.Windows/UITests.Windows.csproj --no-restore

  # ── Android UI tests ──────────────────────────────────────────────────────
  android-ui-tests:
    name: Android UI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium + UIAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Restore Android UI test project
        run: dotnet restore PokemonBattleJournal.UITests/UITests.Android/UITests.Android.csproj

      # AppiumSetup boots the AVD, deploys the APK, and runs tests.
      # avd-name must match the hardcoded "pixel_7_-_api_35" in AppiumSetup.cs.
      - name: Run Android UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: pixel_7_-_api_35
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: dotnet test PokemonBattleJournal.UITests/UITests.Android/UITests.Android.csproj --no-restore

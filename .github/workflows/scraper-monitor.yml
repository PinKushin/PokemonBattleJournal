name: Scraper Monitor

on:
  schedule:
    - cron: '0 13 * * *'   # 08:00 EST (UTC-5) daily
  workflow_dispatch:        # allow manual trigger

# Least privilege for GITHUB_TOKEN. Without this the token takes the repository
# default, which on a public repo with pull_request triggers means workflow code
# proposed by a stranger runs with whatever that default happens to be. Read-only
# is all any job here needs: nothing writes to the repo, opens a release, or
# comments on a PR. Flagged as actions/missing-workflow-permissions by CodeQL.
permissions:
  contents: read

jobs:
  scraper-live-check:
    name: Limitless Live Web Check
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore PokemonBattleJournal.IntegrationTests/PokemonBattleJournal.IntegrationTests.csproj

      - name: Run live scraper tests
        run: >
          dotnet test PokemonBattleJournal.IntegrationTests/PokemonBattleJournal.IntegrationTests.csproj
          --no-restore
          --filter "Category=LiveWeb"
          --logger "trx;LogFileName=scraper-monitor.trx"
          --results-directory TestResults/scraper

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scraper-monitor-results
          path: TestResults/scraper

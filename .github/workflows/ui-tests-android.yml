name: Android UI Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, main]

jobs:
  # Build the APK once — each matrix job used to rebuild the identical APK from
  # scratch (~18 min on a 2-core runner, ×5 jobs). AppiumSetup.BuildAndroidApk()
  # skips its in-process build when the APK exists alongside its .uitest sentinel
  # and no source file is newer, so the matrix jobs just download this artifact,
  # write the sentinel, and go straight to adb install.
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: nuget-android-

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # sdkmanager isn't on PATH outside the emulator action — use ANDROID_HOME directly.
      - name: Install Android SDK platform 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' platform-tools > /dev/null

      # EmbedAssembliesIntoApk required: Appium installs via adb but never pushes
      # fast-deploy assemblies, so without it monodroid aborts "No assemblies found"
      # on launch. Matches the arguments AppiumSetup.BuildAndroidApk() would use.
      - name: Build APK
        run: dotnet build PokemonBattleJournal/PokemonBattleJournal.csproj -f net10.0-android -c Debug -p:EmbedAssembliesIntoApk=true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-test-apk
          path: PokemonBattleJournal/bin/Debug/net10.0-android/com.PinKushin.PokemonBattleJournal-Signed.apk
          if-no-files-found: error

  ui-tests-android:
    name: Android UI Tests (${{ matrix.fixture }})
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        fixture: [AboutPageTests, MainPageTests, OptionsPageTests, ReadJournalPageTests, TrainerPageTests]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      # Restore-only. The build-apk job (which this matrix `needs:`) owns the save for
      # this key, so by the time these jobs run the cache already exists. Using
      # actions/cache here would add a pointless post-step to all five jobs — and on a
      # key rotation they would contend with each other exactly as the Windows matrix
      # did before this change.
      - name: Restore NuGet cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: nuget-android-

      # JDK still needed for sdkmanager/avdmanager inside the emulator action;
      # the maui-android workload is NOT needed here — UITests.Android.csproj is
      # plain net10.0 with no MAUI project reference, and the APK comes prebuilt.
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Restore-only; a single fixture saves it below. No job outside this matrix uses
      # this key, so without the split all five would race to create it on every
      # rotation — and this key rotates on ANY edit to this workflow file.
      - name: Restore npm / Appium cache
        id: appium-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: appium-android-${{ hashFiles('.github/workflows/ui-tests-android.yml') }}

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Appium and UIAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2 || appium driver update uiautomator2

      # Only one fixture saves, designated arbitrarily — with a single save step there
      # is no race, so which one does not matter. Placed right after the install that
      # populates ~/.npm rather than at job end, so a test failure or a cancelled
      # emulator step still leaves a usable cache for the next run.
      - name: Save npm / Appium cache
        if: always() && matrix.fixture == 'AboutPageTests' && steps.appium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.npm
          key: appium-android-${{ hashFiles('.github/workflows/ui-tests-android.yml') }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore
        run: dotnet restore PokemonBattleJournal.UITests/UITests.Android/UITests.Android.csproj

      - name: Download APK artifact
        uses: actions/download-artifact@v7
        with:
          name: android-test-apk
          path: PokemonBattleJournal/bin/Debug/net10.0-android/

      # touch: checkout stamps source files with checkout time; the APK must be
      # newer than every .cs/.xaml/.csproj or AppiumSetup's freshness check
      # rebuilds anyway. Sentinel marks it test-built (vs VS fast-deploy).
      - name: Mark APK as test-built
        run: |
          touch PokemonBattleJournal/bin/Debug/net10.0-android/com.PinKushin.PokemonBattleJournal-Signed.apk
          date -u +"%Y-%m-%dT%H:%M:%SZ" > PokemonBattleJournal/bin/Debug/net10.0-android/com.PinKushin.PokemonBattleJournal-Signed.apk.uitest

      # avd-name must match the hardcoded "pixel_7_-_api_35" constant in AppiumSetup.cs.
      #
      # Script notes:
      # - `timeout 20 adb logcat -d`: AppiumSetup's own teardown kills the emulator
      #   (ShutdownEmulator runs unconditionally) BEFORE dotnet test exits, so by the
      #   time this logcat runs there may be no device — adb then prints
      #   "- waiting for device -" and blocks forever. That was the real cause of the
      #   teardown hangs (the job cancellation debug line showed the hang inside THIS
      #   script step, not the action's Terminate Emulator step). timeout caps it.
      # - pkill -f crashpad_handle[r]: secondary guard for the upstream action teardown
      #   hang (https://github.com/ReactiveCircus/android-emulator-runner/issues/385).
      #   -f is required: bare pkill matches /proc/pid/comm which the kernel truncates
      #   to 15 chars — "crashpad_handler" is 16, so it can never match without -f.
      #   The [r] bracket is required WITH -f: this script's own sh -c command line
      #   contains the pattern text, so an unbracketed -f match SIGKILLs our own shell
      #   before `exit $code` runs (observed: "exit code null" job failures on runs
      #   where every test passed). The regex crashpad_handle[r] matches the real
      #   process but not the literal "crashpad_handle[r]" text in our own cmdline.
      - name: Run Android UI Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          avd-name: pixel_7_-_api_35
          force-avd-creation: false
          # -gpu guest was tried for the ColorBuffer exhaustion and silently fell back
          # to host rendering (ColorBuffer errors persisted, run 30991195983) — modern
          # emulators ignore guest mode. Mitigation instead: NUnit [Order] runs the two
          # affected MainPageTests first, before the popup-heavy tests drain the pool.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 3072
          disable-animations: true
          # hide_error_dialogs: on starved 2-core emulators the LAUNCHER can ANR during
          # the boot storm, and its "Quickstep isn't responding" dialog then owns the
          # accessibility tree — the app renders underneath but none of its elements are
          # reachable (caught by the app-ready gate's PageSource dump, run 30991195983;
          # previously seen as 90s "hamburger never appeared" failures on random fixtures).
          # threebutton nav overlay: the Pixel profile defaults to gesture navigation,
          # whose bottom-edge home zone swallowed a tap meant for the note Editor and
          # BACKGROUNDED THE APP mid-fixture (run 31001057545 — Window.Deactivated 100ms
          # after the click command, every remaining test dead). 3-button nav has no
          # gesture zone to collide with bottom-of-screen elements.
          script: adb shell cmd overlay enable com.android.internal.systemui.navbar.threebutton ; adb shell settings put global hide_error_dialogs 1 ; dotnet test PokemonBattleJournal.UITests/UITests.Android/UITests.Android.csproj --no-restore --filter "FullyQualifiedName~${{ matrix.fixture }}" --logger "trx;LogFileName=android-ui-tests-${{ matrix.fixture }}.trx" ; code=$? ; timeout 20 adb logcat -d > /tmp/UITests.Android.logcat.txt 2>/dev/null || true ; pkill -f -SIGKILL 'crashpad_handle[r]' 2>/dev/null || true ; exit $code
        env:
          CI: true
          ANDROID_USE_INSTALLED: "0"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ui-test-results-${{ matrix.fixture }}
          path: '**/*.trx'

      - name: Upload timing logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ui-timing-logs-${{ matrix.fixture }}
          path: |
            /tmp/UITests.PerfLog.txt
            /tmp/UITests.NavLog.txt
            /tmp/UITests.Android.setup.log
            /tmp/UITests.Android.logcat.txt

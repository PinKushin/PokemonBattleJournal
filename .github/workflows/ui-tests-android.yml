name: Android UI Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, main]

jobs:
  ui-tests-android:
    name: Android UI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: nuget-android-

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Cache npm / Appium
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: appium-android-${{ hashFiles('.github/workflows/ui-tests-android.yml') }}

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Appium and UIAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2 || appium driver update uiautomator2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore
        run: dotnet restore PokemonBattleJournal.UITests/UITests.Android/UITests.Android.csproj

      # avd-name must match the hardcoded "pixel_7_-_api_35" constant in AppiumSetup.cs.
      # AppiumSetup.BuildAndroidApk() builds and installs the APK; Appium launches by package name only.
      - name: Run Android UI Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          avd-name: pixel_7_-_api_35
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 3072
          disable-animations: true
          script: dotnet test PokemonBattleJournal.UITests/UITests.Android/UITests.Android.csproj --no-restore --logger "trx;LogFileName=android-ui-tests.trx" ; code=$? ; adb logcat -d > /tmp/UITests.Android.logcat.txt ; exit $code
        env:
          CI: true
          ANDROID_USE_INSTALLED: "0"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ui-test-results
          path: '**/*.trx'

      - name: Upload timing logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ui-timing-logs
          path: |
            /tmp/UITests.PerfLog.txt
            /tmp/UITests.NavLog.txt
            /tmp/UITests.Android.setup.log
            /tmp/UITests.Android.logcat.txt

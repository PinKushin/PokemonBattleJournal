name: UI Tests

on:
  push:
    branches: [master, main, 'feature/**']
  pull_request:
    branches: [master, main]

jobs:
  # ── Windows UI Tests ──────────────────────────────────────────────────────
  ui-tests-windows:
    name: Windows UI Tests
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: nuget-windows-

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Enable Developer Mode (required for unpackaged MAUI)
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /t REG_DWORD /f /v AllowDevelopmentWithoutDevLicense /d 1

      - name: Cache npm / Appium
        uses: actions/cache@v6
        with:
          path: ~\AppData\Roaming\npm
          key: appium-windows-${{ hashFiles('.github/workflows/ui-tests.yml') }}

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Appium and Windows driver
        run: |
          npm install -g appium
          appium driver install windows || appium driver update windows

      - name: Restore
        run: dotnet restore PokemonBattleJournal.UITests/UITests.Windows/UITests.Windows.csproj

      # AppiumSetup.BuildWindowsApp() builds the MAUI exe before connecting to Appium
      - name: Run Windows UI Tests
        run: dotnet test PokemonBattleJournal.UITests/UITests.Windows/UITests.Windows.csproj --no-restore --logger "trx;LogFileName=windows-ui-tests.trx"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-ui-test-results
          path: '**/*.trx'

  # ── Android UI Tests ──────────────────────────────────────────────────────
  ui-tests-android:
    name: Android UI Tests
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v7

      - name: Set dotnet install dir (user-writable path for self-hosted runner)
        run: |
          echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> $GITHUB_ENV
          echo "DOTNET_ROOT=$HOME/.dotnet" >> $GITHUB_ENV

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-android-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: nuget-android-

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Cache npm / Appium
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: appium-android-${{ hashFiles('.github/workflows/ui-tests.yml') }}

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Appium and UIAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2 || appium driver update uiautomator2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Restore
        run: dotnet restore PokemonBattleJournal.UITests/UITests.Android/UITests.Android.csproj

      # avd-name must match the hardcoded "pixel_7_-_api_35" constant in AppiumSetup.cs.
      # AppiumSetup.BuildAndroidApk() builds and installs the APK; Appium launches by package name only.
      - name: Run Android UI Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: pixel_7_-_api_35
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: dotnet test PokemonBattleJournal.UITests/UITests.Android/UITests.Android.csproj --no-restore --logger "trx;LogFileName=android-ui-tests.trx"
        env:
          CI: true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ui-test-results
          path: '**/*.trx'
